<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회사소개:사업소개</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://kit.fontawesome.com/b5dd439c86.js" crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="./css/sub4_common.css">
    <link rel="stylesheet" href="./css/sub4_4.css">
</head>
<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">네비게이션바로가기</a>
    </div>
     <div id="wrap">
      <header id="headerArea">
          

        </header> 
        <div class="visual">
            <img src="./images/common/sub_visual.jpg" alt="">
            <strong class="hidden">인재채용</strong>
        </div> 

        <div class="sub_nav">
            <ul>
                <li><a href="./sub4_1.html">인사제도</a></li>
                <li><a href="./sub4_2.html">인재육성</a></li>
                <li><a href="https://kbw0503.mycafe24.com/gb/bbs/board.php?bo_table=notice">채용공고</a></li>
                <li><a class="active" href="./sub4_4.html">문의</a></li>
            </ul>
        </div>

        <main id="content">
          <article>
                <div class="title_area">
                    <div class="line_map">
                        HOME &gt; 인재채용 &gt; <strong>문의</strong>
                    </div>
                    <h2>문의<span>건의사항</span></h2>
                    <p>고객님의 소중한 목소리에 귀 기울이며, 더 나은 감동을 준비합니다.</p>
                </div>

                <div class="content_area">
                      <div class="contact">
                        <img src="./images/sub4/contact.jpg" alt="">
                        <form  id="contact-form">
                              <div>
                                 <label for="user-name">이름* </label>
                                 <input type="text" id="user-name" name="user-name" required>
                              </div>
                              <div>
                                 <label for="user-email">이메일* </label>
                                 <input type="email" id="user-email" name="user-email" required>
                              </div>
                              <div>
                                 <label for="user-tel">전화번호* </label>
                                 <input type="text" id="user-tel" name="user-tel" required placeholder="010-0000-0000">
                              </div>
                              <div>
                                 <label for="message">문의내용* </label>
                                 <textarea name="message" id="message"></textarea>
                              </div>
                              <button type="submit">문의하기</button>
                        </form>
                     </div>
                </div>
            </article>
        </main>



       
          <footer id="footerArea">
               
            </footer> 
         </div>             
    
    
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        (function() {
            // https://dashboard.emailjs.com/admin/account
            emailjs.init({
              publicKey: "cyBI7dJ2SNpdpiaZo",
            });
        })();
    </script>
    <script>
            document.getElementById('contact-form').addEventListener('submit', function(event) {
                event.preventDefault();
                // these IDs from the previous steps
                emailjs.sendForm('service_j8wkz3w', 'template_1iy8iok', this)
                    .then(() => {
                        console.log('SUCCESS!');
                        alert('메일 전송에 성공하였습니다.');
                    }, (error) => {
                        console.log('FAILED...', error);
                        alert('메일 전송에 실패하였습니다.');
                    });
            });
    </script>


     <script src="../js/jquery-1.12.4.min.js"></script>
    <script src="../js/jquery-migrate-1.4.1.min.js"></script>
    <script>
        $('#headerArea').load('../common/sub_header.html',function(){
            //function(){} -> main_header.html로드가 완료되면,
            $.getScript('../js/fullnav.js');
        });
        $('#footerArea').load('../common/sub_footer.html',function(){
            $.getScript('../js/select.js');
        })
    </script>

    
    
</body>
</html>
